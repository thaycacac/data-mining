# Cấu hình chung cho dự án. Mọi tham số có tính chọn lựa (ngưỡng, seed,
# tham số thuật toán) được tập trung ở đây để dễ tái lập và chỉnh sửa.

random_seed: 42

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  figures_dir: reports/figures

data_sources:
  # Nguồn dữ liệu chính thức: repo "chính" (TruongThuHa) không có CSV tải
  # được (xem reports/decisions_log.md, mục DEC-001). Dùng repo "mở rộng".
  main_2026:
    url: "https://media.githubusercontent.com/media/sdgedfegw/du-lieu-diem-thi/main/du_lieu_diem_thi_2026.csv"
    local_name: "diem_thi_2026.csv"
    expected_rows: 1208863
    expected_provinces: 34
  bonus_2025:
    url: "https://media.githubusercontent.com/media/sdgedfegw/du-lieu-diem-thi/main/du-lieu-diem-thi-2025-ct2018.csv"
    local_name: "diem_thi_2025_ct2018.csv"
    note: "Chương trình GDPT 2018, dùng cho phân tích so sánh bonus (2026 vs 2025)."

subjects:
  # Tên cột điểm trong CSV gốc -> tên rút gọn dùng nội bộ trong project.
  Toan: toan
  NguVan: ngu_van
  VatLy: vat_ly
  HoaHoc: hoa_hoc
  SinhHoc: sinh_hoc
  LichSu: lich_su
  DiaLy: dia_ly
  KinhTePhapLuat: kinh_te_phap_luat
  TinHoc: tin_hoc
  CongNgheCongNghiep: cong_nghe_cong_nghiep
  CongNgheNongNghiep: cong_nghe_nong_nghiep
  NgoaiNgu: ngoai_ngu

compulsory_subjects: [toan, ngu_van]

score_scale:
  min: 0.0
  max: 10.0
  step: 0.25

# Các ngưỡng/tham số dưới đây sẽ được điền giá trị cụ thể (có căn cứ thống
# kê từ dữ liệu thực tế) ở GIAI ĐOẠN 2-3-4, không áp đặt trước.
discretization:
  # Ngưỡng theo quy ước giáo dục phổ thông VN (Yếu/TB/Khá/Giỏi), không
  # dùng phân vị thống kê vì mục tiêu là luật dễ diễn giải với người làm
  # giáo dục (business audience), không phải phân bố đều số lượng mỗi
  # bin. Xem decisions_log.md DEC-006.
  edges: [0, 5, 6.5, 8, 10.01]
  labels: ["Yeu", "TrungBinh", "Kha", "Gioi"]

association_rules:
  min_support_grid: [0.01, 0.02, 0.05, 0.1]
  min_confidence: 0.6
  min_lift: 1.0

clustering:
  k_range: [2, 10]
  linkage: "ward"

exam_site:
  # SBD = tỉnh(2 số) + điểm_thi(3 số) + số_thứ_tự(3 số) theo quan sát từ
  # repo gốc. site_code_digits mô tả vị trí 3 số "mã điểm thi" trong phần
  # 6 số còn lại của SBD_New (sau khi bỏ mã tỉnh).
  site_code_slice: [0, 3]
  sliding_window_sizes: [24, 50, 100]  # dùng để kiểm tra độ nhạy

anomaly_detection:
  isolation_forest:
    n_estimators: 200
    contamination: 0.02
  lof:
    n_neighbors: 20
    contamination: 0.02
